services:
  - type: web
    name: violence-detection-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: MALLOC_ARENA_MAX
        value: 2
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /opt/render/project/src/static/uploads
    autoDeploy: false